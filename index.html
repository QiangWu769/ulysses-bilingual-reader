<script id="reader-data" type="application/json">[{"pdfPage": 5, "heading": "I", "startsMidParagraph": false, "endsMidParagraph": true, "paragraphs": [{"en": "Stately, plump Buck Mulligan came from the stairhead, bearing a bowl of lather on which a mirror and a razor lay crossed. A yellow dressinggown, ungirdled, was sustained gently behind him on the mild morning air. He held the bowl aloft and intoned:", "zh": "丰腴的巴克·穆利根仪态堂皇地从楼梯口走来，手里托着一碗剃须泡沫，碗上交叉搁着一面镜子和一把剃刀。一件没系腰带的黄色晨衣，在温柔的晨风里轻轻飘在他身后。他高举起碗，拖长声调吟诵道："}, {"en": "—Introibo ad altare Dei.", "zh": "——我要走近上帝的祭坛。"}, {"en": "Halted, he peered down the dark winding stairs and called out coarsely:", "zh": "他停下来，往黑洞洞的旋梯下面张望，粗声喊道："}, {"en": "—Come up, Kinch! Come up, you fearful jesuit!", "zh": "——上来，金奇！上来，你这个可怕的耶稣会士！"}, {"en": "Solemnly he came forward and mounted the round gunrest. He faced about and blessed gravely thrice the tower, the surrounding land and the awaking mountains. Then, catching sight of Stephen Dedalus, he bent towards him and made rapid crosses in the air, gurgling in his throat and shaking his head. Stephen Dedalus, displeased and sleepy, leaned his arms on the top of the staircase and looked coldly at the shaking gurgling face that blessed him, equine in its length, and at the light untonsured hair, grained and hued like pale oak.", "zh": "他庄严地走上前去，登上圆形炮座。他转过身，一本正经地朝塔楼、周围的土地和正在苏醒的群山祝福了三遍。接着，他瞥见斯蒂芬·迪达勒斯，便朝他俯下身去，飞快地在空中画起十字，喉咙里咕噜作响，脑袋摇个不停。斯蒂芬·迪达勒斯满心不快，睡意未消，双臂撑在楼梯顶端，冷冷地望着那张一面摇晃、一面咕噜着给他祝福的马一般的长脸，以及那头未经削发礼的浅色头发，纹理和色泽都像淡淡的橡木。"}, {"en": "Buck Mulligan peeped an instant under the mirror and then covered the bowl smartly.", "zh": "巴克·穆利根朝镜子底下瞄了一眼，随即利落地把碗盖住。"}, {"en": "—Back to barracks! he said sternly.", "zh": "——回营房去！他严厉地说。"}, {"en": "He added in a preacher’s tone:", "zh": "他又用布道者的口吻说道："}, {"en": "—For this, O dearly beloved, is the genuine Christine: body and soul and blood and ouns. Slow music, please. Shut your eyes, gents. One moment. A little trouble about those white corpuscles. Silence, all.", "zh": "——因为，啊，亲爱的诸位，这才是货真价实的女基督：肉身、灵魂、鲜血，还有伤口。请奏慢乐。先生们，闭上眼睛。稍等。那些白血球有点小麻烦。肃静，各位。"}, {"en": "He peered sideways up and gave a long slow whistle of call, then paused awhile in rapt attention, his even white teeth glistening here and there with gold points. Chrysostomos. Two strong shrill whistles answered through the calm.", "zh": "他侧着头往上看，吹了一声长长的、缓缓的呼哨，随后停了一会儿，凝神谛听；他整齐的白牙间，这儿那儿闪着金光。金口。两声响亮刺耳的口哨穿过宁静，回应了他。"}, {"en": "—Thanks, old chap, he cried briskly. That will do nicely. Switch off the current, will you?", "zh": "——谢谢，老兄，他精神抖擞地喊道。这就妥当了。把电源关了，好吗？"}, {"en": "He skipped off the gunrest and looked gravely at his watcher, gathering about his legs the loose folds of his gown. The plump shadowed face and", "zh": "他从炮座上轻快地跳下来，把松散的晨衣褶子拢在腿边，神情庄重地望着那位看客。那张胖胖的、笼着阴影的脸，加上"}]}, {"pdfPage": 6, "heading": "I", "startsMidParagraph": true, "endsMidParagraph": false, "paragraphs": [{"en": "sullen oval jowl recalled a prelate, patron of arts in the middle ages. A pleasant smile broke quietly over his lips.", "zh": "阴沉的椭圆形下颌，让人想起中世纪一位庇护艺术的主教。他嘴角悄悄绽开一丝和悦的微笑。"}, {"en": "—The mockery of it! he said gaily. Your absurd name, an ancient Greek!", "zh": "——真够可笑的！他兴高采烈地说。你那个荒唐名字，古希腊人的名字！"}, {"en": "He pointed his finger in friendly jest and went over to the parapet, laughing to himself. Stephen Dedalus stepped up, followed him wearily halfway and sat down on the edge of the gunrest, watching him still as he propped his mirror on the parapet, dipped the brush in the bowl and lathered cheeks and neck.", "zh": "他善意地开着玩笑，伸出手指点了点，独自笑着走向矮墙。斯蒂芬·迪达勒斯上了台阶，疲倦地跟到半途，便坐在炮座边缘，仍看着他把镜子支在矮墙上，把刷子蘸进碗里，给脸颊和脖子抹上泡沫。"}, {"en": "Buck Mulligan’s gay voice went on.", "zh": "巴克·穆利根欢快的声音又响起来。"}, {"en": "—My name is absurd too: Malachi Mulligan, two dactyls. But it has a Hellenic ring, hasn’t it? Tripping and sunny like the buck himself. We must go to Athens. Will you come if I can get the aunt to fork out twenty quid?", "zh": "——我的名字也荒唐：马拉基·穆利根，两个扬抑抑格。可它听起来颇有希腊味儿，不是吗？轻快又明朗，就像巴克老兄本人。我们一定得去雅典。要是我能让姨妈掏出二十镑，你肯一起去吗？"}, {"en": "He laid the brush aside and, laughing with delight, cried:", "zh": "他把刷子搁在一旁，乐不可支地笑着喊道："}, {"en": "—Will he come? The jejune jesuit!", "zh": "——他肯去吗？这位干巴巴的耶稣会士！"}, {"en": "Ceasing, he began to shave with care.", "zh": "他不再说话，开始仔细地刮脸。"}, {"en": "—Tell me, Mulligan, Stephen said quietly.", "zh": "——我问你，穆利根，斯蒂芬轻声说。"}, {"en": "—Yes, my love?", "zh": "——什么事，亲爱的？"}, {"en": "—How long is Haines going to stay in this tower?", "zh": "——海恩斯还要在这座塔里住多久？"}, {"en": "Buck Mulligan showed a shaven cheek over his right shoulder.", "zh": "巴克·穆利根转过右肩，露出一边刮干净的脸颊。"}, {"en": "—God, isn’t he dreadful? he said frankly. A ponderous Saxon. He thinks you’re not a gentleman. God, these bloody English! Bursting with money and indigestion. Because he comes from Oxford. You know, Dedalus, you have the real Oxford manner. He can’t make you out. O, my name for you is the best: Kinch, the knife-blade.", "zh": "——天哪，他可真够呛，是不是？他直言不讳地说。一个笨重的撒克逊人。他觉得你不是绅士。天哪，这些该死的英国佬！钱和消化不良快把他们撑炸了。就因为他是牛津来的。你知道吗，迪达勒斯，你才有真正的牛津派头。他摸不透你。啊，我给你起的名字才最贴切：金奇，刀刃。"}, {"en": "He shaved warily over his chin.", "zh": "他小心地刮着下巴。"}, {"en": "—He was raving all night about a black panther, Stephen said. Where is his guncase?", "zh": "——他整夜说胡话，说什么黑豹，斯蒂芬说。他的枪套在哪儿？"}, {"en": "—A woful lunatic! Mulligan said. Were you in a funk?", "zh": "——一个可悲的疯子！穆利根说。你吓坏了吗？"}, {"en": "—I was, Stephen said with energy and growing fear. Out here in the dark with a man I don’t know raving and moaning to himself about shooting a black panther. You saved men from drowning. I’m not a hero, however. If he stays on here I am off.", "zh": "——是的，斯蒂芬激动地说，恐惧又渐渐涌上来。黑灯瞎火地待在这儿，身边是个陌生人，独自胡言乱语、哼哼唧唧，说要开枪打黑豹。你从水里救过人。可我不是英雄。他要继续住在这儿，我就走。"}, {"en": "Buck Mulligan frowned at the lather on his razorblade. He hopped down from his perch and began to search his trouser pockets hastily.", "zh": "巴克·穆利根皱着眉头，看了看剃刀刃上的泡沫。他从栖身之处跳下来，急急忙忙地摸起裤兜。"}, {"en": "—Scutter! he cried thickly.", "zh": "——狗屎！他含混地骂道。"}, {"en": "He came over to the gunrest and, thrusting a hand into Stephen’s upper pocket, said:", "zh": "他走到炮座边，把一只手伸进斯蒂芬上衣的口袋，说道："}]}, {"pdfPage": 7, "heading": "I", "startsMidParagraph": false, "endsMidParagraph": true, "paragraphs": [{"en": "—Lend us a loan of your noserag to wipe my razor.", "zh": "——把你的鼻涕布借给我擦擦剃刀。"}, {"en": "Stephen suffered him to pull out and hold up on show by its corner a dirty crumpled handkerchief. Buck Mulligan wiped the razorblade neatly. Then, gazing over the handkerchief, he said:", "zh": "斯蒂芬任由他抽出一条又脏又皱的手帕，捏着一角举起来展示。巴克·穆利根把刀刃擦得干干净净。接着，他从手帕上方望过来，说道："}, {"en": "—The bard’s noserag! A new art colour for our Irish poets: snotgreen. You can almost taste it, can’t you?", "zh": "——诗人的鼻涕布！给咱们爱尔兰诗人添一种新的艺术色彩：鼻涕绿。几乎都能尝到味儿，是不是？"}, {"en": "He mounted to the parapet again and gazed out over Dublin bay, his fair oakpale hair stirring slightly.", "zh": "他又登上矮墙，眺望都柏林湾，橡木般淡色的浅发微微飘动。"}, {"en": "—God! he said quietly. Isn’t the sea what Algy calls it: a grey sweet mother? The snotgreen sea. The scrotumtightening sea. Epi oinopa ponton. Ah, Dedalus, the Greeks! I must teach you. You must read them in the original. Thalatta! Thalatta! She is our great sweet mother. Come and look.", "zh": "——天哪！他轻声说。这大海，不正像阿尔吉说的那样，是位灰色的慈爱母亲吗？鼻涕绿的大海。叫人阴囊紧缩的大海。在酒色的大海上。啊，迪达勒斯，希腊人！我一定得教教你。你必须读他们的原文。大海！大海！她是我们伟大而慈爱的母亲。过来看看。"}, {"en": "Stephen stood up and went over to the parapet. Leaning on it he looked down on the water and on the mailboat clearing the harbourmouth of Kingstown.", "zh": "斯蒂芬站起来，走到矮墙边。他倚着墙，低头看着海水，以及那艘正在驶出金斯敦港口的邮船。"}, {"en": "—Our mighty mother! Buck Mulligan said.", "zh": "——我们威严强大的母亲！巴克·穆利根说。"}, {"en": "He turned abruptly his grey searching eyes from the sea to Stephen’s face.", "zh": "他忽然把那双带着探究神色的灰眼睛从海上移开，转向斯蒂芬的脸。"}, {"en": "—The aunt thinks you killed your mother, he said. That’s why she won’t let me have anything to do with you.", "zh": "——姨妈觉得是你害死了你母亲，他说。所以她不让我跟你有任何来往。"}, {"en": "—Someone killed her, Stephen said gloomily.", "zh": "——总有人害死了她，斯蒂芬阴郁地说。"}, {"en": "—You could have knelt down, damn it, Kinch, when your dying mother asked you, Buck Mulligan said. I’m hyperborean as much as you. But to think of your mother begging you with her last breath to kneel down and pray for her. And you refused. There is something sinister in you . . .", "zh": "——该死的，金奇，你母亲临终时求你，你本可以跪下来的，巴克·穆利根说。我跟你一样，是个极北之人。可想想看，你母亲用最后一口气求你跪下，为她祈祷。你竟然拒绝了。你身上有种阴森的东西……"}, {"en": "He broke off and lathered again lightly his farther cheek. A tolerant smile curled his lips.", "zh": "他停住话头，又在另一边脸颊上薄薄地涂了些泡沫。嘴角弯起一丝宽容的笑意。"}, {"en": "—But a lovely mummer! he murmured to himself. Kinch, the loveliest mummer of them all!", "zh": "——可又是个讨人喜欢的戏子！他自言自语地低声说。金奇，所有戏子里最讨人喜欢的一个！"}, {"en": "He shaved evenly and with care, in silence, seriously.", "zh": "他沉默而认真地刮着脸，动作平稳，十分仔细。"}, {"en": "Stephen, an elbow rested on the jagged granite, leaned his palm against his brow and gazed at the fraying edge of his shiny black coat-sleeve. Pain, that was not yet the pain of love, fretted his heart. Silently, in a dream she had come to him after her death, her wasted body within its loose brown graveclothes giving off an odour of wax and rosewood, her breath, that had bent upon him, mute, reproachful, a faint odour of wetted ashes. Across the threadbare cuffedge he saw the sea hailed as a great sweet mother by the", "zh": "斯蒂芬把一只肘撑在凹凸不平的花岗岩上，手掌抵着额头，凝视自己那件黑外套发亮的袖子上磨毛的边缘。一阵痛楚折磨着他的心，那还不是爱的痛楚。母亲死后，曾在梦里默默地来到他面前，消瘦的身躯裹在宽松的褐色寿衣中，散发着蜡与花梨木的气味；她俯向他，一言不发，满含责备，呼吸带着一丝湿灰烬的气息。越过磨破的袖口边缘，他看见了那片大海，身旁有人正用"}]}, {"pdfPage": 8, "heading": "I", "startsMidParagraph": true, "endsMidParagraph": false, "paragraphs": [{"en": "wellfed voice beside him. The ring of bay and skyline held a dull green mass of liquid. A bowl of white china had stood beside her deathbed holding the green sluggish bile which she had torn up from her rotting liver by fits of loud groaning vomiting.", "zh": "吃得饱饱的嗓音，把它称作伟大而温柔的母亲。海湾与天际线围成的圆弧里，盛着一汪暗绿色的液体。她的临终病榻旁也曾放着一只白瓷碗，盛着绿色黏滞的胆汁；她一阵阵大声呻吟着呕吐，从腐烂的肝脏里硬把它们呕了出来。"}, {"en": "Buck Mulligan wiped again his razorblade.", "zh": "巴克·穆利根又擦了擦剃刀刀片。"}, {"en": "—Ah, poor dogsbody! he said in a kind voice. I must give you a shirt and a few noserags. How are the secondhand breeks?", "zh": "——啊，可怜的受气包！他和气地说。我得给你一件衬衫，再给你几条擦鼻涕的布。那条二手裤子怎么样？"}, {"en": "—They fit well enough, Stephen answered.", "zh": "——还算合身，斯蒂芬回答。"}, {"en": "Buck Mulligan attacked the hollow beneath his underlip.", "zh": "巴克·穆利根向下嘴唇底下的凹处发起进攻。"}, {"en": "—The mockery of it, he said contentedly. Secondleg they should be. God knows what poxy bowsy left them off. I have a lovely pair with a hair stripe, grey. You’ll look spiffing in them. I’m not joking, Kinch. You look damn well when you’re dressed.", "zh": "——真可笑，他心满意足地说。该叫二脚货才对。天知道是哪个生花柳病的酒鬼穿剩下的。我有一条漂亮的灰裤子，带细条纹。你穿上一定神气极了。我不是开玩笑，金奇。你一打扮起来，他妈的真好看。"}, {"en": "—Thanks, Stephen said. I can’t wear them if they are grey.", "zh": "——谢谢，斯蒂芬说。要是灰色的，我就不能穿。"}, {"en": "—He can’t wear them, Buck Mulligan told his face in the mirror. Etiquette is etiquette. He kills his mother but he can’t wear grey trousers.", "zh": "——他不能穿，巴克·穆利根对着镜子里的自己的脸说。礼数就是礼数。他杀了自己的母亲，却不能穿灰裤子。"}, {"en": "He folded his razor neatly and with stroking palps of fingers felt the smooth skin.", "zh": "他利落地折起剃刀，用触须般的指腹轻轻摩挲，试试皮肤是否光滑。"}, {"en": "Stephen turned his gaze from the sea and to the plump face with its smokeblue mobile eyes.", "zh": "斯蒂芬把目光从海上移向那张胖脸，脸上有一双灵动的烟蓝色眼睛。"}, {"en": "—That fellow I was with in the Ship last night, said Buck Mulligan, says you have g.p.i. He’s up in Dottyville with Connolly Norman. General paralysis of the insane!", "zh": "——昨天晚上跟我在船舶酒馆的那个家伙，巴克·穆利根说，说你得了 G.P.I.。他在疯人城跟着康诺利·诺曼。精神病患者的全身麻痹！"}, {"en": "He swept the mirror a half circle in the air to flash the tidings abroad in sunlight now radiant on the sea. His curling shaven lips laughed and the edges of his white glittering teeth. Laughter seized all his strong wellknit trunk.", "zh": "他拿着镜子在空中划了半个圆，让这消息借着此刻辉映海面的阳光闪传开去。他剃净胡须的双唇弯着笑，亮闪闪的白牙边缘也在笑。笑声攫住了他整个结实强健的躯干。"}, {"en": "—Look at yourself, he said, you dreadful bard!", "zh": "——瞧瞧你自己，他说，你这个吓人的诗人！"}, {"en": "Stephen bent forward and peered at the mirror held out to him, cleft by a crooked crack. Hair on end. As he and others see me. Who chose this face for me? This dogsbody to rid of vermin. It asks me too.", "zh": "斯蒂芬向前俯身，细看那面递到眼前的镜子，一道弯弯曲曲的裂纹把它劈开了。头发根根竖着。他和别人眼中的我。是谁替我挑了这张脸？这具得清除虱子的贱躯。它也这样问我。"}, {"en": "—I pinched it out of the skivvy’s room, Buck Mulligan said. It does her all right. The aunt always keeps plainlooking servants for Malachi. Lead him not into temptation. And her name is Ursula.", "zh": "——我从女佣房里顺来的，巴克·穆利根说。她用着挺好。姨妈为了马拉基，总是雇些相貌平平的佣人。莫叫他陷于诱惑。而她的名字叫乌尔苏拉。"}, {"en": "Laughing again, he brought the mirror away from Stephen’s peering eyes.", "zh": "他又笑了，把镜子从斯蒂芬细瞧的眼前移开。"}]}, {"pdfPage": 9, "heading": "I", "startsMidParagraph": false, "endsMidParagraph": false, "paragraphs": [{"en": "—The rage of Caliban at not seeing his face in a mirror, he said. If Wilde were only alive to see you!", "zh": "——卡利班看不见镜子里自己的脸时的狂怒，他说。要是王尔德还活着，能瞧见你就好了！"}, {"en": "Drawing back and pointing, Stephen said with bitterness:", "zh": "斯蒂芬退后一步，指着镜子，苦涩地说："}, {"en": "—It is a symbol of Irish art. The cracked looking-glass of a servant.", "zh": "——这是爱尔兰艺术的象征。一面佣人的破镜子。"}, {"en": "Buck Mulligan suddenly linked his arm in Stephen’s and walked with him round the tower, his razor and mirror clacking in the pocket where he had thrust them.", "zh": "巴克·穆利根忽然挽住斯蒂芬的胳膊，和他绕着塔楼走。他先前塞进口袋里的剃刀和镜子碰得咔嗒作响。"}, {"en": "—It’s not fair to tease you like that, Kinch, is it? he said kindly. God knows you have more spirit than any of them.", "zh": "——这样逗弄你可不公道，金奇，是不是？他和气地说。天知道，你比他们任何一个都有灵气。"}, {"en": "Parried again. He fears the lancet of my art as I fear that of his. The cold steelpen.", "zh": "又被挡开了。他害怕我的艺术的柳叶刀，正如我害怕他的。冰冷的钢笔尖。"}, {"en": "—Cracked lookingglass of a servant! Tell that to the oxy chap downstairs and touch him for a guinea. He’s stinking with money and thinks you’re not a gentleman. His old fellow made his tin by selling jalap to Zulus or some bloody swindle or other. God, Kinch, if you and I could only work together we might do something for the island. Hellenise it.", "zh": "——一面佣人的破镜子！把这话说给楼下那个牛津佬听，向他讨一基尼。他满身铜臭，还觉得你算不上绅士。他老子靠把泻药卖给祖鲁人发了财，要不就是干了什么该死的骗局。天哪，金奇，要是你我能一起干，说不定能替这座岛做点事。让它古希腊化。"}, {"en": "Cranly’s arm. His arm.", "zh": "克兰利的胳膊。他的胳膊。"}, {"en": "—And to think of your having to beg from these swine. I’m the only one that knows what you are. Why don’t you trust me more? What have you up your nose against me? Is it Haines? If he makes any noise here I’ll bring down Seymour and we’ll give him a ragging worse than they gave Clive Kempthorpe.", "zh": "——想到你居然得向这些猪猡乞讨。只有我才知道你是什么样的人。你为什么不能多信任我一点？你到底对我有什么不满？是因为海恩斯吗？他要是在这儿吵闹，我就把西摩叫来，我们会好好捉弄他一顿，比他们捉弄克莱夫·肯普索普还狠。"}, {"en": "Young shouts of moneyed voices in Clive Kempthorpe’s rooms. Palefaces: they hold their ribs with laughter, one clasping another. O, I shall expire! Break the news to her gently, Aubrey! I shall die! With slit ribbons of his shirt whipping the air he hops and hobbles round the table, with trousers down at heels, chased by Ades of Magdalen with the tailor’s shears. A scared calf’s face gilded with marmalade. I don’t want to be debagged! Don’t you play the giddy ox with me!", "zh": "克莱夫·肯普索普的房间里，阔少们年轻的嗓音在叫嚷。一张张苍白的脸：他们搂在一起，笑得直捂肋骨。啊，我要断气了！奥布里，把这消息轻轻告诉她！我要死了！他被剪成一条条的衬衫在空中抽打着，裤子褪到脚跟，绕着桌子又蹦又跛；莫德林学院的埃兹举着裁缝的大剪刀在后面追他。一张受惊小牛般的脸，被橘子酱涂得金黄。我不要被扒裤子！别跟我犯浑！"}, {"en": "Shouts from the open window startling evening in the quadrangle. A deaf gardener, aproned, masked with Matthew Arnold’s face, pushes his mower on the sombre lawn watching narrowly the dancing motes of grasshalms.", "zh": "喊声从敞开的窗户传出，惊动了四方庭院里的暮色。一个耳聋的园丁系着围裙，脸上仿佛戴着马修·阿诺德的面具，在阴沉的草坪上推着割草机，眯眼细看草茎碎屑翩翩飞舞。"}, {"en": "To ourselves . . . new paganism . . . omphalos.", "zh": "致我们自己……新异教……脐。"}, {"en": "—Let him stay, Stephen said. There’s nothing wrong with him except at night.", "zh": "——让他待着吧，斯蒂芬说。他没什么毛病，除了夜里。"}]}]</script>
<script>
'use strict';
const pages=JSON.parse(document.getElementById('reader-data').textContent);
const $=id=>document.getElementById(id);
let pageIndex=0,fontSize=18;
try{const stored=Number(localStorage.getItem('ulysses-reader-font'));if(stored>=16&&stored<=28)fontSize=stored;}catch(e){}
pages.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`正文 ${i+1} / ${pages.length}`;$('page').append(option);});
function updateFont(){document.documentElement.style.setProperty('--text-size',fontSize+'px');$('size').textContent=fontSize;$('smaller').disabled=fontSize<=16;$('larger').disabled=fontSize>=28;try{localStorage.setItem('ulysses-reader-font',fontSize);}catch(e){}}
function renderPage(i){pageIndex=Math.min(pages.length-1,Math.max(0,i));const page=pages[pageIndex];const content=document.createDocumentFragment();page.paragraphs.forEach(pair=>{const row=document.createElement('div');row.className='pair';const en=document.createElement('p');en.lang='en';en.textContent=pair.en;const zh=document.createElement('p');zh.className='zh';zh.lang='zh-CN';zh.textContent=pair.zh;row.append(en,zh);content.append(row);});$('parallel').replaceChildren(content);$('page').value=pageIndex;$('source-page').textContent=`PDF 第 ${page.pdfPage} 页`;$('prev').disabled=pageIndex===0;$('next').disabled=pageIndex===pages.length-1;document.querySelector('.intro').hidden=pageIndex!==0;$('continuation').textContent=pageIndex===pages.length-1?'本次内容到此 · 正文前五页':page.endsMidParagraph?'本页末句接续至下一页':'';$('progress').style.width=((pageIndex+1)/pages.length*100)+'%';$('reading').scrollTop=0;$('announcement').textContent=`正文第 ${pageIndex+1} 页，PDF 第 ${page.pdfPage} 页`;}
$('prev').addEventListener('click',()=>renderPage(pageIndex-1));$('next').addEventListener('click',()=>renderPage(pageIndex+1));$('page').addEventListener('change',e=>renderPage(Number(e.target.value)));$('smaller').addEventListener('click',()=>{fontSize=Math.max(16,fontSize-1);updateFont();});$('larger').addEventListener('click',()=>{fontSize=Math.min(28,fontSize+1);updateFont();});document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,button')||e.ctrlKey||e.altKey||e.metaKey)return;if(e.key==='ArrowRight'){e.preventDefault();renderPage(pageIndex+1);}if(e.key==='ArrowLeft'){e.preventDefault();renderPage(pageIndex-1);}});updateFont();renderPage(0);
</script>

</html>
